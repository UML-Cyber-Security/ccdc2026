- name: Create bt accounts
  ansible.builtin.user:
    name: "{{ item }}"
    create_home: yes
    shell: /bin/bash
    groups: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"
    append: yes
  loop: "{{ users }}"

- name: Add authorized keys
  ansible.builtin.authorized_key:
    user: "{{ item }}"
    key: "{{ lookup('file', '/location/of/ssh/key') }}"
  loop: "{{ users }}"

- name: Allow sudoless password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/blueteam"
    content: |
      {% for user in users %}
      {{ user }} ALL=(ALL) NOPASSWD:ALL
      {% endfor %}
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'