---
- name: Configure Blue Team System Accounts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Ensure blue team users exist
      ansible.builtin.user:
        name: "{{ item }}"
        home: "/var/lib/{{ item }}"
        shell: /bin/bash
        comment: "Blue Team Account"
        state: present
      loop: "{{ blue_team_users }}"

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/var/lib/{{ item }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ item }}"
        group: "{{ item }}"
      loop: "{{ blue_team_users }}"

    - name: Deploy authorized keys
      ansible.builtin.authorized_key:
        user: "{{ item }}"
        state: present
        key: "{{ ssh_key }}"
      loop: "{{ blue_team_users }}"

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        content: "{{ item }} ALL=(ALL) NOPASSWD:ALL"
        dest: "/etc/sudoers.d/{{ item }}"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      loop: "{{ blue_team_users }}"

    - name: Immutable restriction for sudoers and ssh
      ansible.builtin.command:
        cmd: "chattr +i /etc/sudoers.d/{{ item }} /var/lib/{{ item }}/.ssh"
      loop: "{{ blue_team_users }}"
      changed_when: false
