---
- name: CCDC Red Team Detection Sweep
  hosts: linux
  become: yes
  gather_facts: no
  tasks:
    - name: 1. Check for suspicious listening ports
      shell: ss -tulpn
      register: open_ports

    - name: 2. List all users with a login shell
      shell: grep -E '/(bash|sh|zsh)$' /etc/passwd
      register: login_users

    - name: 3. Check for recently modified files in /etc (last 60 mins)
      shell: find /etc -mmin -60 -type f
      register: modified_configs

    - name: 4. Check for hidden files in /tmp and /dev/shm
      shell: ls -la /tmp /dev/shm | grep '\.'
      register: hidden_files

    - name: 5. List all active cron jobs for all users
      shell: |
        for user in $(cut -f1 -d: /etc/passwd); do 
          echo "User: $user"; crontab -u $user -l 2>/dev/null; 
        done
      register: cron_jobs

    - name: 6. Check for large/suspicious deleted files still held open
      # Common for hiding malware/log wipers
      shell: lsof +L1
      register: deleted_but_open

    - name: REPORT SUMMARY
      debug:
        msg:
          - "--- OPEN PORTS ---"
          - "{{ open_ports.stdout_lines }}"
          - "--- RECENT CONFIG CHANGES ---"
          - "{{ modified_configs.stdout_lines }}"
          - "--- SUSPICIOUS TMP FILES ---"
          - "{{ hidden_files.stdout_lines }}"
          - "--- OPEN DELETED FILES ---"
          - "{{ deleted_but_open.stdout_lines }}"
