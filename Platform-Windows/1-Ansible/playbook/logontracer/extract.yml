- name: Combine AD local + forwarded logs into one EVTX for LogonTracer
  hosts: ad
  gather_facts: false

  tasks:
    - name: Ensure combined log folder exists
      ansible.windows.win_file:
        path: C:\Logs\Combined
        state: directory

    - name: Generate timestamp
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M') | trim }}"

    - name: Export AD LOCAL Security log (LogonTracer events only)
      ansible.windows.win_shell: |
        $dir = "C:\Logs\Combined"
        $output = Join-Path $dir "AD_Local_{{ timestamp }}.evtx"

        $query = "*[System[(EventID=4624 or EventID=4625 or EventID=4672 or EventID=4768 or EventID=4769 or EventID=4776)]]"

        wevtutil epl Security $output "/q:$query"
        Write-Output "Exported local AD log to $output"
      register: local_evtx

    - name: Export FORWARDED EVENTS (LogonTracer events only)
      ansible.windows.win_shell: |
        $dir = "C:\Logs\Combined"
        $output = Join-Path $dir "Forwarded_{{ timestamp }}.evtx"

        $query = "*[System[(EventID=4624 or EventID=4625 or EventID=4672 or EventID=4768 or EventID=4769 or EventID=4776)]]"

        wevtutil epl ForwardedEvents $output "/q:$query"
        Write-Output "Exported forwarded events to $output"
      register: forwarded_evtx

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ local_evtx.stdout }}"
          - "{{ forwarded_evtx.stdout }}"
