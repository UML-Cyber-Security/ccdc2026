---
# Role: fetch_logs
# Purpose: Find and fetch EVTX files from Windows AD to Ansible controller

- name: Find AD_Local and Forwarded EVTX files with sizes
  ansible.windows.win_shell: |
    $folder = '{{ windows_logs_combined_path }}'
    if (Test-Path $folder) {
        $localFile = Get-ChildItem -Path $folder -Filter 'AD_Local_*.evtx' |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        $fwdFile = Get-ChildItem -Path $folder -Filter 'Forwarded_*.evtx' |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        $localPath = if ($localFile) { $localFile.FullName } else { "" }
        $localSize = if ($localFile) { $localFile.Length } else { 0 }
        $fwdPath = if ($fwdFile) { $fwdFile.FullName } else { "" }
        $fwdSize = if ($fwdFile) { $fwdFile.Length } else { 0 }
        "$localPath|$localSize|$fwdPath|$fwdSize"
    }
  register: evtx_paths_raw
  changed_when: false

- name: Fail if no EVTX files found
  ansible.builtin.fail:
    msg: "No EVTX files found in {{ windows_logs_combined_path }} on the Windows AD machine."
  when: evtx_paths_raw.stdout | trim == "||0" or evtx_paths_raw.stdout | trim == ""

- name: Save EVTX paths and sizes as facts
  ansible.builtin.set_fact:
    local_evtx: "{{ (evtx_paths_raw.stdout | trim).split('|')[0] }}"
    local_evtx_size: "{{ (evtx_paths_raw.stdout | trim).split('|')[1] }}"
    forwarded_evtx: "{{ (evtx_paths_raw.stdout | trim).split('|')[2] }}"
    forwarded_evtx_size: "{{ (evtx_paths_raw.stdout | trim).split('|')[3] }}"

- name: "[FETCH] Starting transfer from Windows AD"
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "FETCHING FILES FROM WINDOWS AD"
      - "========================================"
      - "AD Local:   {{ (local_evtx_size | int / 1048576) | round(2) }} MB"
      - "Forwarded:  {{ (forwarded_evtx_size | int / 1048576) | round(2) }} MB"
      - "Total:      {{ ((local_evtx_size | int + forwarded_evtx_size | int) / 1048576) | round(2) }} MB"
      - "========================================"

- name: Ensure local temp folder exists on controller
  ansible.builtin.file:
    path: "{{ controller_temp_path }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: "[FETCH] Fetching Forwarded EVTX ({{ (forwarded_evtx_size | int / 1048576) | round(2) }} MB)..."
  ansible.builtin.fetch:
    src: "{{ forwarded_evtx }}"
    dest: "{{ controller_temp_path }}/"
    flat: true
  register: fetch_forwarded

- name: "[FETCH] Fetching AD_Local EVTX ({{ (local_evtx_size | int / 1048576) | round(2) }} MB)..."
  ansible.builtin.fetch:
    src: "{{ local_evtx }}"
    dest: "{{ controller_temp_path }}/"
    flat: true
  register: fetch_local

# noqa: run-once[task]
- name: Save fetched paths for subsequent plays
  ansible.builtin.set_fact:
    fetched_local_path: "{{ fetch_local.dest }}"
    fetched_forwarded_path: "{{ fetch_forwarded.dest }}"
  delegate_to: localhost
  run_once: true

- name: "[FETCH] Transfer complete"
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "FETCH COMPLETE"
      - "========================================"
      - "AD Local:   {{ fetch_local.dest }}"
      - "Forwarded:  {{ fetch_forwarded.dest }}"
      - "========================================"
