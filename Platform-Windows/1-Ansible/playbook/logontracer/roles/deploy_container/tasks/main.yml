---
# Role: deploy_container
# Purpose: Deploy Neo4j and LogonTracer Docker containers
#
# This role ensures Docker is installed and deploys both containers.
# It is safe to run multiple times.

# Ensure Docker is installed
- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Fail if Docker is not installed
  ansible.builtin.fail:
    msg: |
      Docker is not installed on this host.
      Please install Docker first:
        curl -fsSL https://get.docker.com | sh
        sudo usermod -aG docker {{ ansible_user }}
  when: docker_check.rc != 0

# Create Docker network if it doesn't exist
- name: Check if Docker network exists
  ansible.builtin.command: "docker network inspect {{ docker_network_name }}"
  register: network_exists
  failed_when: false
  changed_when: false
  become: true

- name: Create Docker network
  ansible.builtin.command: "docker network create {{ docker_network_name }}"
  become: true
  when: network_exists.rc != 0

# Create required directories on host
- name: Create LogonTracer data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ logontracer_host_incoming_path }}"
    - "{{ logontracer_host_data_path }}"
  become: true

#######################################
# Neo4j Container
#######################################
- name: Check if Neo4j container exists
  ansible.builtin.command: "docker inspect {{ neo4j_container_name }}"
  register: neo4j_exists
  failed_when: false
  changed_when: false
  become: true

- name: Pull Neo4j Docker image
  ansible.builtin.command: "docker pull {{ neo4j_image }}"
  become: true
  when: neo4j_exists.rc != 0

- name: Deploy Neo4j container
  ansible.builtin.command: >
    docker run -d
    --name {{ neo4j_container_name }}
    --network {{ docker_network_name }}
    --restart unless-stopped
    -p {{ neo4j_http_port }}:7474
    -p {{ neo4j_bolt_port }}:7687
    -e NEO4J_AUTH=none
    {{ neo4j_image }}
  become: true
  when: neo4j_exists.rc != 0
  register: neo4j_created

- name: Wait for Neo4j container to be ready
  ansible.builtin.command: "docker exec {{ neo4j_container_name }} echo 'ready'"
  register: neo4j_ready
  until: neo4j_ready.rc == 0
  retries: 30
  delay: 2
  become: true
  when: neo4j_created.changed | default(false)

#######################################
# LogonTracer Container
#######################################
- name: Check if LogonTracer container exists
  ansible.builtin.command: "docker inspect {{ logontracer_container_name }}"
  register: logontracer_exists
  failed_when: false
  changed_when: false
  become: true

- name: Deploy LogonTracer container
  ansible.builtin.command: >
    docker run -d
    --name {{ logontracer_container_name }}
    --network {{ docker_network_name }}
    --restart unless-stopped
    -p {{ logontracer_web_port }}:8080
    {{ logontracer_image }}
  become: true
  when: logontracer_exists.rc != 0
  register: logontracer_created

- name: Wait for LogonTracer container to be ready
  ansible.builtin.command: "docker exec {{ logontracer_container_name }} echo 'ready'"
  register: logontracer_ready
  until: logontracer_ready.rc == 0
  retries: 30
  delay: 2
  become: true
  when: logontracer_created.changed | default(false)

#######################################
# Status Report
#######################################
- name: Deployment status
  ansible.builtin.debug:
    msg: |
      Neo4j container '{{ neo4j_container_name }}': {{ 'already exists' if neo4j_exists.rc == 0 else 'deployed' }}
      LogonTracer container '{{ logontracer_container_name }}': {{ 'already exists' if logontracer_exists.rc == 0 else 'deployed' }}

      Web UI: http://{{ ansible_host }}:{{ logontracer_web_port }}
      Neo4j Browser: http://{{ ansible_host }}:{{ neo4j_http_port }}
