version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - proxy-network

  # Example backend web servers
  web1:
    image: nginx:alpine
    container_name: web-backend-1
    volumes:
      - ./web1:/usr/share/nginx/html:ro
    networks:
      - proxy-network

  web2:
    image: nginx:alpine
    container_name: web-backend-2
    volumes:
      - ./web2:/usr/share/nginx/html:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge