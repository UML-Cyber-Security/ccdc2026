global
    log stdout format raw local0 info
    maxconn 4096
    
    # Security hardening
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    
    # SSL/TLS settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Performance tuning
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 10s
    
    # Error handling
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# Statistics page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    
    # Authentication for stats page
    stats auth admin:changeme123
    
    # Monitor URI for health checks
    monitor-uri /health

# HTTP frontend - redirect to HTTPS
frontend http_front
    bind *:80
    
    # ACL for Let's Encrypt challenges
    acl letsencrypt_acl path_beg /.well-known/acme-challenge/
    use_backend letsencrypt_backend if letsencrypt_acl
    
    # Redirect all HTTP to HTTPS
    redirect scheme https code 301 if !letsencrypt_acl

# HTTPS frontend
frontend https_front
    bind *:443 ssl crt /etc/ssl/certs/combined.pem alpn h2,http/1.1
    
    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Rate limiting using stick tables
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }
    
    # ACLs for routing
    acl is_api path_beg /api
    acl is_admin path_beg /admin
    acl is_static path_end .jpg .jpeg .png .gif .css .js .ico .svg .woff .woff2
    
    # Routing based on ACLs
    use_backend api_backend if is_api
    use_backend admin_backend if is_admin
    use_backend static_backend if is_static
    default_backend web_backend

# Backend for web servers
backend web_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # Server definitions with health checks
    server app1 app1:80 check inter 2000 rise 2 fall 3 maxconn 500
    server app2 app2:80 check inter 2000 rise 2 fall 3 maxconn 500
    server app3 app3:80 check inter 2000 rise 2 fall 3 maxconn 500 backup
    
    # Headers to backend
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request add-header X-Forwarded-Proto https if { ssl_fc }

# Backend for API servers
backend api_backend
    balance leastconn
    option httpchk GET /api/health
    
    server api1 app1:80 check inter 2000 rise 2 fall 3
    server api2 app2:80 check inter 2000 rise 2 fall 3

# Backend for admin interface (more restrictive)
backend admin_backend
    balance roundrobin
    
    # Additional rate limiting for admin
    stick-table type ip size 10k expire 10s store http_req_rate(10s)
    http-request track-sc1 src
    http-request deny if { sc_http_req_rate(1) gt 10 }
    
    server admin1 app1:80 check

# Backend for static content
backend static_backend
    balance roundrobin
    option httpchk HEAD /
    
    # Enable caching headers
    http-response set-header Cache-Control "public, max-age=3600"
    
    server static1 app1:80 check
    server static2 app2:80 check

# Backend for Let's Encrypt challenges
backend letsencrypt_backend
    server letsencrypt 127.0.0.1:8888